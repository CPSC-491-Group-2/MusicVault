name: Deploy

on:
  # Ships whatever Docker Build just published from master.
  workflow_run:
    workflows: ["Docker Build"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. latest, sha-abc1234)"
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # workflow_run also fires for failed builds; only ship green ones.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, prod-1]

    steps:
      # Checked out for compose.yaml, pinned to the commit that was built.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # sha-<7> mirrors the type=sha tag Docker Build publishes.
      - name: Resolve image tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:5000/api/v1/health && exit 0
            sleep 2
          done
          docker compose logs --tail 50
          exit 1
