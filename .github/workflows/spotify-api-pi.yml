name: Spotify API CI

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "test/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  spotify-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spotify-api-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Spotify service tests
        run: |
          python -m pytest tests/services/test_spotify_service.py -v

      - name: Run Spotify parser tests
        run: |
          python -m pytest tests/services/test_spotify_parser.py -v