name: Docker Build

on:
  push:
    branches:
      - master
    # Optional: build/publish version tags such as v1.2.3.
    tags:
      - "v*"
  pull_request:

# Required for reading the repository and publishing images to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so Docker can access the source and Dockerfile.
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR requires image/repository names to be lowercase.
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Enable Docker Buildx.
      # This can later be extended for multi-platform builds (e.g. amd64 + arm64).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in only when we may publish an image.
      #
      # GHCR is used by default.
      # For Docker Hub, change registry to docker.io and use secrets such as:
      #   username: ${{ secrets.DOCKERHUB_USERNAME }}
      #   password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # The same pattern can be used for another registry with repository secrets.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags and OCI labels automatically.
      # Examples:
      #   master
      #   sha-abc1234
      #   1.2.3 (from tag v1.2.3)
      #   latest (default branch only)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the image for every run, but publish only for non-PR events.
      # Change ./Dockerfile if the repository's Dockerfile lives elsewhere.
      #
      # Add "build-args:" here later if the image requires build arguments.
      # Add "platforms:" here later for multi-platform image builds.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Reuse Docker build layers between workflow runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max