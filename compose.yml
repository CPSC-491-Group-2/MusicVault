name: musicvault

services:
  backend:
  image: ghcr.io/cpsc-491-group-2/musicvault-backend:${TAG:-latest}
  build:
    context: .
    dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Values come from the shell or a repo-root .env (see .env.example).
    # Secrets stay out of the image and out of this file.
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      # DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://localhost:5432/musicvault}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      # localhost here is the container itself; point this at the database's
      # host or its container name on the musicvault network. Defaults to the
      # same URL as db/session.py so the backend still starts when unset.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://localhost:5432/musicvault}
    networks:
      - musicvault
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/cpsc-491-group-2/musicvault-frontend:${TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    networks:
      - musicvault
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Hits the /api proxy, so it also proves frontend can reach backend.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  # Fixed name so other stacks (db, reverse proxy) can join it.
  musicvault:
    name: musicvault
